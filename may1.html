<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables & Forms</title>
</head>
<body>
   <div> 
    <form action="" method="post">
        <h2>Registration Form</h2>
        <label for="FirstName:">First Name : &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;</label>
        <input type="text" name="FirstName" id=" FirstName" placeholder="Enter First Name"><br>
        <br>
<label for="LastName">Last Name : &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;</label>
<input type="text" name="LastName" id="LastName" placeholder="Enter Last Name"><br>
        <br>
        <label for="Email">Email : &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;</label>
        <input type="email" name="Email" id="Email" placeholder="Enter Email Address"><br>
        <br>
        <label for="Password">Password : &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;</label>
        <input type="password" name="Password" id="Password" placeholder=""><br>
        <br>
        <div class="form-group">
            <label for="Gender">Gender : &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;</label>
            <span>Male</span>
            <input type="radio" name="Gender" value="Male">
            <span>Female</span>
            <input type="radio" name="Gender" value="Female">
            <span>Other</span>
            <input type="radio" name="Gender" value="Other">
        </div><br>
        <label for="user-age">Age : &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;</label>
        <input type="number" name="Age" id="user-age" min="1" max="80" placeholder=""><br>
        <br>
        <div class="form-group">
            <label for="Preferences"> Preferences : &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;</label>
            <input type="checkbox" name="Preference1">Acrylic Painting
            <input type="checkbox" name="Preference2"> Oil Painting <br>
            </div>
            <br>
            <label for="Occupation">Occupation : &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;</label>
<select name="Occupation" id="Occupation">
    <option value="">Student</option>
    <option value="">Teacher</option>
    <option value="">Other</option>
</select><br>
        <br>
        <div class="row" style="display: flex; align-items: flex-start;">
            <label for="">Bio : &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;</label>
            <textarea name="Bio" id="" cols="30" rows="5" placeholder="Share few lines about yourself..."></textarea>

        </div>
        
        <br>
       &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;&nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;<input type="reset">
        <input type="submit">
    </form>
</div> 
</body>
</html>
